<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stratus House Media</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e3b54a'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-weight='700' font-size='28' text-anchor='middle' fill='%23030b2e'%3ESH%3C/text%3E%3C/svg%3E">
<style>
/* Look B "Studio Cards": flat navy, big rounded cards, gold actions; studio floor of stations with little workers. */
:root{
  --navy:#030b2e; --floor:#0a1747; --card:#13215c; --card2:#1a2a6c; --line:#2a3b7d;
  --gold:#e3b54a; --gold2:#f6dc8a; --ink:#eef1fb; --mute:#9aa6cf;
  --ok:#3ecf8e; --sleep:#7a86b3; --bad:#ff6b6b; --tt:#ff5c8a;
  --sans:"Bricolage Grotesque","Manrope","Avenir Next","Helvetica Neue",system-ui,sans-serif;
  --serif:"Cinzel","Trajan Pro",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
@font-face{font-family:"Bricolage Grotesque";src:local("Bricolage Grotesque"),url(/static/bricolage.woff2) format("woff2");font-weight:200 800;font-display:swap}
html,body{margin:0;background:var(--navy);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px;display:flex;flex-direction:column;gap:16px}
.hero{position:relative;height:clamp(150px,19vw,240px);margin:-6px -10px 2px}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 14%,#000 66%,transparent);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 14%,#000 66%,transparent);mask-composite:intersect}
.bar{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:14px 10px 0}
.bar .pill{box-shadow:0 4px 14px rgba(0,0,0,.35)}
@media (max-width:700px){.hero{height:auto}.hero img{position:relative;display:block;height:130px}.bar{justify-content:center;padding-top:0}}
.sh{width:44px;height:44px;border-radius:12px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font:700 18px var(--serif)}
.bar h1{margin:0;font-size:20px;font-weight:800;flex:1 1 240px}
.bar h1 small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.pill{border:0;font-size:12px;font-weight:800;padding:8px 13px;border-radius:999px;background:var(--card);white-space:nowrap}
.pill.g{background:var(--gold);color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border-radius:16px;padding:12px 14px;border:0;text-align:left}
.kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--mute);font-weight:600}
.kpi.hi{background:var(--gold);color:var(--navy)} .kpi.hi .k{color:#3b2e0a}
.errs{display:flex;flex-direction:column;gap:8px}
.err{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;background:rgba(255,107,107,.1);border:1px solid var(--bad);border-radius:14px;padding:12px 14px}
.err .ic{width:28px;height:28px;border-radius:50%;background:var(--bad);color:var(--navy);display:grid;place-items:center;font-weight:800;flex:none}
.err .body{flex:1 1 300px;min-width:0}
.err b{display:block;font-size:14px}
.err .what{color:var(--mute)}
.err .fix{color:var(--gold2);font-weight:700}
.err .acts{display:flex;gap:6px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.floor{background:var(--floor);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.lanehead{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-weight:800;margin:4px 6px 2px}
.lane{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.belt{height:10px;border-radius:5px;margin:6px 6px 4px;background:repeating-linear-gradient(90deg,rgba(227,181,74,.55) 0 14px,transparent 14px 26px);background-size:26px 10px;opacity:.55}
@keyframes belt{to{background-position:26px 0}}
.st{background:var(--card);border-radius:18px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0;position:relative;border:1px solid transparent;text-align:left;color:var(--ink)}
.st:hover{border-color:var(--line)}
.st.you{border-color:var(--gold);background:linear-gradient(180deg,#2a2a4f,#13215c)}
.st.error{border-color:var(--bad);background:linear-gradient(180deg,#3a1f3a,#13215c)}
.sign{display:flex;justify-content:space-between;align-items:center;gap:6px}
.sign b{font-size:13px;font-weight:800}
.num{font-size:11px;color:var(--mute);font-weight:800}
.stage{height:190px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.stage svg{height:106px;width:auto;max-width:100%}
.stage::before{content:"";position:absolute;bottom:2px;left:30%;right:30%;height:12px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent)}
.stage img.emp{position:relative;height:182px;width:auto;max-width:100%;object-fit:contain;display:block;transform-origin:50% 100%;transition:transform .25s}
.st:hover .stage img.emp{transform:scale(1.04)}
.st.error .stage img.emp{filter:sepia(.4) saturate(1.6) hue-rotate(-35deg) brightness(.85)}
img.face{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 0%;background:#13215c;border:2px solid var(--gold)}
.desk{position:absolute;left:8%;right:8%;bottom:0;height:6px;border-radius:3px;background:var(--gold);opacity:.8}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800}
.doing{font-size:12px;color:var(--mute)}
.zzz{position:absolute;right:20%;top:6px;font-weight:800;color:var(--sleep);font-size:13px}

@keyframes bob{50%{transform:translateY(-3px)}}
.badge{position:absolute;top:-9px;right:10px;background:var(--gold);color:var(--navy);font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.st.error .badge{background:var(--bad)}
@media (prefers-reduced-motion:reduce){.belt,.st.ok svg{animation:none}}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(1,4,20,.6);display:flex;justify-content:flex-end;z-index:20}
.sheet{width:min(640px,100%);height:100%;overflow:auto;background:var(--floor);border-left:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.sheet h2 .x{margin-left:auto}
.sheet h3{margin:6px 0 0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
.muted{color:var(--mute)}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:800;font-size:13px;background:#1e2f78}
a.btn{color:var(--ink);text-decoration:none;display:inline-block}
.btn.go{background:var(--gold);color:var(--navy)}
.btn.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.box{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
input[type=text],input[type=password],input[type=url],input[type=datetime-local],textarea,select{width:100%;background:var(--navy);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:74px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);font-weight:700}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--mute)}
.drop.on{border-color:var(--gold);color:var(--gold2)}
.clipcard{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;background:var(--card);border-radius:16px;padding:12px}
.clipcard video{width:150px;aspect-ratio:9/16;border-radius:12px;background:#000;object-fit:cover}
.clipcard .fields{display:flex;flex-direction:column;gap:8px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#13215c;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
.chip.on{border-color:var(--gold);color:var(--gold2);background:rgba(227,181,74,.12)}
.why{font-size:12px;color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
th{color:var(--gold2);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.prog{height:8px;border-radius:4px;background:#1b2a63;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--gold);color:var(--navy);font-weight:800;padding:10px 16px;border-radius:12px;z-index:40;max-width:90vw}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;flex:1;min-height:240px}
.msgs{display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1;padding-right:4px}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:#1c2c6e}
.msg.sm{align-self:flex-start;background:rgba(227,181,74,.12);border:1px solid rgba(227,181,74,.4)}
.msg small{display:block;font-size:10px;color:var(--gold2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.confirm{align-self:flex-start;background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-width:90%}
.inbar{display:flex;gap:8px;align-items:center}
.mic{width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);display:grid;place-items:center;flex:none}
.mic.rec{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,107,107,.2)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:12px;font-weight:800;color:var(--mute)}
.seg button.on{background:var(--gold);color:var(--navy)}
@media (max-width:900px){.lane{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.clipcard{grid-template-columns:minmax(0,1fr)}.clipcard video{width:100%}}

/* ---------- demo mode ---------- */
.demoflag{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--gold);color:var(--navy);text-align:center;font-weight:800;font-size:13px;padding:6px 12px}
body.demo .wrap{padding-top:34px;padding-bottom:230px}
body.demo .st{opacity:.38;transition:opacity .3s,transform .3s,box-shadow .3s}
body.demo .st.spot{opacity:1;transform:translateY(-4px);border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,181,74,.35),0 14px 30px rgba(0,0,0,.45)}
body.demo .st.done{opacity:.75}
.demobox{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:31;width:min(760px,calc(100vw - 32px));background:var(--card2);border:1px solid var(--gold);border-radius:20px;padding:14px 16px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.demobox img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 0;background:var(--navy);border:2px solid var(--gold)}
.demobox .step{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
.demobox h3{margin:2px 0 4px;font-size:18px}
.demobox p{margin:0 0 8px;color:var(--ink)}
.demobox .ex{background:var(--navy);border-radius:12px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.demobox .ex b{color:var(--gold)}
.demobox .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demobox .dots{display:flex;gap:4px;margin-right:auto}
.demobox .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.demobox .dots i.on{background:var(--gold)}
.demobox .bar2{grid-column:1/-1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.demobox .bar2 i{display:block;height:100%;background:var(--gold);width:0}
.demobox.play .bar2 i{animation:dfill linear forwards}
@keyframes dfill{to{width:100%}}
@media (max-width:560px){.demobox{grid-template-columns:1fr}.demobox img{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><img src="/static/banner.jpg" alt="Stratus House"><div class="bar">
    <button class="pill" id="demoBtn">▶ Demo</button>
    <button class="pill" id="settingsBtn">⚙ Settings</button>
    <button class="pill g" id="talkBtn">🎙 Talk to manager</button>
  </div></div>
  <div class="errs" id="errs"></div>
  <div class="kpis" id="kpis"></div>
  <div class="legend">
    <span><i class="dot" style="background:var(--ok)"></i>Working</span>
    <span><i class="dot" style="background:var(--gold)"></i>Waiting on you</span>
    <span><i class="dot" style="background:var(--sleep)"></i>Off shift / quiet</span>
    <span><i class="dot" style="background:var(--bad)"></i>Problem</span>
  </div>
  <div class="floor" id="floor"></div>
  <p class="muted" style="margin:0">Click any employee to open their station.</p>
</div>
<div id="demoRoot"></div>
<div id="sheetRoot"></div>
<input type="file" id="filePick" hidden>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = null;            // latest state
let openStation = null;  // station currently shown in the sheet
let voiceOn = (() => { try { return localStorage.getItem("voice") !== "off"; } catch (e) { return true; } })();

async function api(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (j.message) toast(j.message);
  await refresh();
  if (openStation) renderSheet(openStation, true);
  return j;
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3600);
}
async function upload(kind, file, extra = "") {
  toast("Uploading " + file.name + "…");
  const r = await fetch(`/api/upload?kind=${kind}&name=${encodeURIComponent(file.name)}${extra}`, {method: "POST", body: file});
  let j = {}; try { j = await r.json(); } catch (e) {}
  toast(j.message || (r.ok ? "Saved." : "Upload failed."));
  await refresh();
  if (openStation && kind !== "cover") renderSheet(openStation, true);
  return j;
}
function pickFile(accept, cb) {
  const fp = $("#filePick"); fp.accept = accept; fp.value = "";
  fp.onchange = () => fp.files[0] && cb(fp.files[0]); fp.click();
}
function dropZone(el, accept, cb) {
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("on"); });
  el.addEventListener("dragleave", () => el.classList.remove("on"));
  el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("on"); [...e.dataTransfer.files].forEach(cb); });
  el.addEventListener("click", () => pickFile(accept, cb));
}

/* ---------- little workers (flat SVG) ---------- */
const G="#e3b54a",G2="#f6dc8a",N="#030b2e",W="#eef1fb";
const props={
  box:`<rect x="64" y="56" width="26" height="20" rx="2" fill="${G}"/><path d="M64 62h26" stroke="${N}" stroke-width="2"/><rect x="73" y="53" width="8" height="6" fill="${W}"/>`,
  scissors:`<circle cx="70" cy="74" r="5" fill="none" stroke="${G}" stroke-width="3"/><circle cx="82" cy="74" r="5" fill="none" stroke="${G}" stroke-width="3"/><path d="M72 70l14-18M80 70l-10-18" stroke="${W}" stroke-width="3" stroke-linecap="round"/>`,
  pen:`<rect x="62" y="64" width="26" height="16" rx="2" fill="${W}"/><path d="M66 69h14M66 74h10" stroke="#9aa6cf" stroke-width="2"/><path d="M84 52l6 6-12 12-7 1 1-7z" fill="${G}"/>`,
  stamp:`<rect x="64" y="70" width="26" height="9" rx="2" fill="${G}"/><rect x="73" y="56" width="8" height="15" fill="${G2}"/><circle cx="77" cy="54" r="5" fill="${G}"/>`,
  plane:`<path d="M62 70l32-16-10 26-7-7-8 5 2-9z" fill="${W}"/><path d="M77 73l17-19" stroke="${G}" stroke-width="2"/>`,
  phone:`<rect x="68" y="50" width="18" height="30" rx="4" fill="${N}" stroke="${G}" stroke-width="2"/><path d="M73 62c3-3 6 3 9 0" stroke="#ff5c8a" stroke-width="2" fill="none"/>`,
  chart:`<rect x="62" y="54" width="30" height="26" rx="3" fill="${W}"/><rect x="66" y="68" width="5" height="9" fill="${G}"/><rect x="74" y="63" width="5" height="14" fill="${G}"/><rect x="82" y="58" width="5" height="19" fill="${G}"/>`,
  binoc:`<circle cx="70" cy="62" r="6" fill="${N}" stroke="${G}" stroke-width="3"/><circle cx="84" cy="62" r="6" fill="${N}" stroke="${G}" stroke-width="3"/><rect x="74" y="59" width="6" height="5" fill="${G}"/>`,
  camera:`<rect x="62" y="58" width="30" height="20" rx="4" fill="${N}" stroke="${G}" stroke-width="2"/><circle cx="77" cy="68" r="6" fill="${G}"/><circle cx="77" cy="68" r="2.5" fill="${N}"/><rect x="66" y="54" width="8" height="5" rx="1" fill="${G}"/>`,
  book:`<rect x="62" y="54" width="28" height="26" rx="2" fill="${W}"/><rect x="62" y="54" width="5" height="26" fill="${G}"/><path d="M72 62h12M72 67h9" stroke="#9aa6cf" stroke-width="2"/>`,
  mic:`<rect x="74" y="60" width="3" height="20" fill="${W}"/><rect x="70" y="48" width="11" height="15" rx="5.5" fill="${G}"/><path d="M72 52h7M72 56h7" stroke="${N}" stroke-width="1.2"/>`
};
let _wid = 0;
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(c + (amt > 0 ? (255 - c) * amt : c * amt))));
  return "#" + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, "0")).join("");
}
/* 3D-style employee: shaded head and body, gold metal accents, eye shine, floor shadow. */
function workerSVG(o, sleep) {
  const k = "w" + (++_wid);
  const skinG = `url(#${k}s)`, bodyG = `url(#${k}b)`, goldG = `url(#${k}g)`;
  const defs = `<defs>
    <radialGradient id="${k}s" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="${shade(o.skin, .35)}"/><stop offset=".55" stop-color="${o.skin}"/><stop offset="1" stop-color="${shade(o.skin, -.35)}"/></radialGradient>
    <linearGradient id="${k}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(o.shirt, .28)}"/><stop offset=".6" stop-color="${o.shirt}"/><stop offset="1" stop-color="${shade(o.shirt, -.45)}"/></linearGradient>
    <linearGradient id="${k}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1bf"/><stop offset=".45" stop-color="#e3b54a"/><stop offset="1" stop-color="#9a6d16"/></linearGradient>
    <radialGradient id="${k}h" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="${shade(o.hair || "#222", .3)}"/><stop offset="1" stop-color="${o.hair || "#222"}"/></radialGradient>
  </defs>`;
  const eyes = sleep
    ? `<path d="M40 41h5M53 41h5" stroke="${N}" stroke-width="2.2" stroke-linecap="round"/>`
    : `<ellipse cx="42.5" cy="40.5" rx="2.6" ry="3" fill="${N}"/><ellipse cx="55.5" cy="40.5" rx="2.6" ry="3" fill="${N}"/><circle cx="43.4" cy="39.4" r=".9" fill="#fff"/><circle cx="56.4" cy="39.4" r=".9" fill="#fff"/>`;
  const top = o.hat === "cap"
    ? `<path d="M30.5 33a18.5 17 0 0 1 37 0z" fill="${goldG}"/><path d="M58 30h15a2 2 0 0 1 0 4H58z" fill="${goldG}"/><path d="M34 27q15-9 30 0" stroke="#fff6d6" stroke-width="1.4" fill="none" opacity=".7"/>`
    : o.hat === "beret"
    ? `<ellipse cx="47" cy="25" rx="20" ry="8" fill="${goldG}"/><circle cx="47" cy="17.5" r="2.8" fill="${goldG}"/><ellipse cx="41" cy="22.5" rx="8" ry="2" fill="#fff6d6" opacity=".55"/>`

/* ---------- render ---------- */
let lastFloor = "";
function render() {
  document.title = (S.clips_waiting.length ? `(${S.clips_waiting.length}) ` : "") + "Stratus House Media";
  $("#errs").innerHTML = S.errors.map(e => `
    <div class="err" role="alert"><span class="ic">!</span>
      <div class="body"><b>${esc(e.worker)}: ${esc(e.title)}${e.count > 1 ? ` (×${e.count})` : ""}</b>
        <span class="what">What went wrong: ${esc(e.what)}</span><br><span class="fix">What to do: ${esc(e.fix)}</span>
        <div class="muted" style="font-size:11px">${esc(e.time.replace("T", " "))}</div></div>
      <div class="acts">
        ${e.action === "settings" ? `<button class="btn go sm" data-act="settings">Open Settings</button>` : ""}
        ${(e.action || "").startsWith("retry:") ? `<button class="btn go sm" data-retry="${e.id}">Retry</button>` : ""}
        <button class="btn sm" data-dismiss="${e.id}">Got it</button></div></div>`).join("");
  const st = S.stats;
  $("#kpis").innerHTML = `
    <button class="kpi ${S.clips_waiting.length ? "hi" : ""}" data-open="desk"><div class="v">${S.clips_waiting.length}</div><div class="k">Clips need your OK</div></button>
    <button class="kpi" data-open="analyst"><div class="v">${st.views == null ? "–" : st.views.toLocaleString()}</div><div class="k">Views tracked</div></button>
    <button class="kpi" data-open="courier"><div class="v">${S.posts_used} / ${S.posts_limit}</div><div class="k">Free posts this month</div></button>
    <button class="kpi" data-open="sales"><div class="v">${S.sales.imported_at ? "$" + S.sales.royalty.toLocaleString(undefined,{minimumFractionDigits:2}) : "–"}</div><div class="k">Book royalties (last report)</div></button>`;
  const W = Object.fromEntries(S.workers.map(w => [w.id, w]));
  const floorHTML = LANES.map(([title, ids], i) => `
    <div class="lanehead">${title}</div>
    <div class="lane">${ids.map((id, n) => {
      const w = W[id]; const [c, label] = STATUS[w.status] || STATUS.idle;
      const num = LANES.slice(0, i).reduce((a, l) => a + l[1].length, 0) + n + 1;
      const badge = w.status === "error" ? "Problem" : (w.status === "you" && w.count ? w.count + " waiting" : "");
      return `<button class="st ${w.status}" data-open="${id}">
        ${badge ? `<span class="badge">${badge}</span>` : ""}
        <div class="sign"><b>${esc(w.name)}</b><span class="num">#${num}</span></div>
        <div class="stage">${empImg(id, w.status === "off")}${w.status === "off" ? '<span class="zzz">z z</span>' : ""}</div>
        <span class="status"><i class="dot" style="background:${c}"></i>${label}</span>
        <span class="doing">${esc(w.doing)}</span></button>`;
    }).join("")}</div>
    ${i < LANES.length - 1 ? '<div class="belt" aria-hidden="true"></div>' : ""}`).join("");
  if (floorHTML !== lastFloor) { $("#floor").innerHTML = floorHTML; lastFloor = floorHTML; }
}

async function refresh() {
  if (demo) return;
  try {
    const r = await fetch("/api/state"); const ns = await r.json(); if (demo) return; S = ns;
  } catch (e) {
    $("#errs").innerHTML = `<div class="err"><span class="ic">!</span><div class="body"><b>Dashboard: can't reach the dashboard service</b><span class="what">What went wrong: the small helper program on your Mac stopped answering.</span><br><span class="fix">What to do: restart your Mac, or ask Claude in your project chat.</span></div></div>`;
    return;
  }
  render();
  // Live-refresh only read-only stations, so nothing he's typing gets wiped.
  if (["clipper","courier","analyst","tiktok","sales","captions","scout"].includes(openStation)) renderSheet(openStation, true);
}

function openSheet(id) { openStation = id; renderSheet(id); }
function closeSheet() { openStation = null; $("#sheetRoot").innerHTML = ""; }
function renderSheet(id, soft) {
  const w = S.workers.find(x => x.id === id) || {name: "Settings"};
  const scrollTop = soft ? ($("#sheetRoot .sheet")?.scrollTop || 0) : 0;
  const html = (SHEETS[id] || (() => ""))();
  $("#sheetRoot").innerHTML = `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-label="${esc(w.name)}">
    <h2>${id === "settings" ? "⚙" : `${faceImg(id)}`}${esc(id === "settings" ? "Settings" : w.name)}<button class="btn sm x" data-close>Close</button></h2>
    ${w.doing ? `<div class="muted">${esc(w.doing)}</div>` : ""}${html}</div></div>`;
  $("#sheetRoot .sheet").scrollTop = scrollTop;
  (AFTER[id] || (() => {}))();
}

    <div class="box"><b>Posting profile</b><span class="muted">Upload-Post profile: ${esc(S.settings.profile)} (Instagram + YouTube)${S.settings.dry_run ? " · TEST MODE: nothing really posts" : ""}</span></div>
    ${S.past_errors.length ? `<h3>Fixed problems</h3><table>${S.past_errors.map(e => `<tr><td>${esc(e.time.replace("T"," ").slice(0,16))}</td><td>${esc(e.worker)}: ${esc(e.title)}</td></tr>`).join("")}</table>` : ""}`
};

function confirmCard(a) {
  return `<div class="confirm"><b>Confirm post</b><span>${esc((a.caption || "").split("\n")[0])}</span>
    <span class="muted">${a.platforms.map(p => p[0].toUpperCase() + p.slice(1)).join(", ")} · ${esc(a.time_nice || a.time)}</span>
    <div class="row"><button class="btn go sm" data-confirm="${a.id}">Confirm</button><button class="btn sm" data-cancel="${a.id}">Cancel</button></div></div>`;
}

const AFTER = {
  inbox: () => {
    dropZone($("#vidDrop"), "video/*", f => upload("video", f));
    $("#linkGo").onclick = () => api("/api/link", {url: $("#linkIn").value});
  },
  ugc: () => {

    $("#bkCover").onclick = () => pickFile("image/*", async f => { const j = await upload("cover", f); cover = j.path; $("#bkCoverName").textContent = f.name; });
    $("#bkSave").onclick = () => api("/api/book", {title: $("#bkTitle").value, amazon_url: $("#bkUrl").value, cover});
  },

    $("#sendBtn").onclick = sendChat;
    $("#chatIn").onkeydown = e => { if (e.key === "Enter") sendChat(); };
    $("#micBtn").onclick = toggleMic;
    $("#voiceTog").onchange = e => { voiceOn = e.target.checked; try { localStorage.setItem("voice", voiceOn ? "on" : "off"); } catch (x) {} };
    $("#chatIn").focus();
  },
  settings: () => {
    $("#kSave").onclick = () => api("/api/settings", {anthropic_key: $("#kClaude").value, upload_post_key: $("#kUpload").value});
    $("#kTest").onclick = () => api("/api/test-claude");
    $("#addMusic").onclick = () => pickFile("audio/*", f => upload("music", f));
  }
};

/* ---------- chat + voice ---------- */
let busy = false;
async function sendChat(textArg) {
  const inp = $("#chatIn"); const text = (typeof textArg === "string" ? textArg : inp.value).trim();
  if (!text || busy) return;
  busy = true; inp.value = "";
  const m = $("#msgs");
  m.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(text)}</div><div class="msg sm" id="thinking"><small>Social Media Manager</small>Thinking…</div>`);
  m.scrollTop = m.scrollHeight;
  let j = {};
  try { const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text})}); j = await r.json(); }
  catch (e) { j = {reply: "I couldn't reach the dashboard service."}; }
  busy = false;
  await refresh();
  if (openStation === "manager") renderSheet("manager", true);
  if (voiceOn && j.reply && "speechSynthesis" in window) {
    const u = new SpeechSynthesisUtterance(j.reply.replace(/[#*_`]/g, ""));
    const v = speechSynthesis.getVoices().find(v => /en-US/.test(v.lang) && /(Daniel|Alex|Aaron|Evan|Nathan|Tom)/.test(v.name)) || speechSynthesis.getVoices().find(v => /en/.test(v.lang));
    if (v) u.voice = v; u.rate = 1.03; speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
}
let rec = null;
function toggleMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("Voice input needs Safari or Chrome. You can still type."); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = true;
  const btn = $("#micBtn"); btn.classList.add("rec");
  let finalText = "";
  rec.onresult = e => { let t = ""; for (const r of e.results) t += r[0].transcript; $("#chatIn").value = t; if (e.results[e.results.length - 1].isFinal) finalText = t; };
  rec.onerror = e => { toast(e.error === "not-allowed" ? "Allow the microphone for this page in your browser settings." : "Didn't catch that. Try again."); };
  rec.onend = () => { btn.classList.remove("rec"); rec = null; if (finalText) sendChat(finalText); };
  rec.start();
}


/* ---------- demo mode: walks through every employee with made-up sample data.
   It never calls the server, posts nothing and spends no credits. ---------- */
const DEMO_STEPS = [
  ["inbox", "Picks up every video you drop in or link you paste, and lines it up for tonight.",
   "New video in: <b>“Sample: 12-minute business talk”</b> (link pasted 9:41 PM)", "Got 1 new video"],
  ["clipper", "Works overnight (10 PM to 6 AM). Finds the best moments and cuts them into vertical clips under 60 seconds.",
   "Made <b>3 clips</b>: 0:42–1:31 (49s) · 4:10–4:58 (48s) · 8:02–8:55 (53s)", "Cutting clip 3 of 3"],
  ["captions", "Writes a hook, a caption and 3–5 hashtags for each clip, with no typos.",
   "<b>“Nobody tells you this about your first $10k…”</b> #business #success #mindset", "Writing captions"],
  ["desk", "Your desk. Nothing posts until you press Approve. You pick the platform and time.",
   "Clip 1 <b>approved</b> for Instagram + YouTube · Friday 6:30 PM", "1 clip waiting on you"],
  ["courier", "Posts your approved clips at the time you picked, through Upload-Post.",
   "Clip 1 <b>posted</b> to Instagram + YouTube (demo only, nothing really posted)", "Posting clip 1"],
  ["tiktok", "TikTok can't be posted automatically on the free plan, so this employee hands you the clip and copies the caption for you.",
   "Caption <b>copied</b>. Open TikTok, add the clip, paste.", "Clip 1 ready for TikTok"],
  ["analyst", "Checks your views every 6 hours and tracks how close you are to getting paid.",
   "Clip 1: <b>1,240 views</b> · 38 likes · 6 shares", "Counting views"],
  ["scout", "Every Monday at 5:41 AM, sends trending video ideas for your niches.",
   "Trending: <b>“morning routine”</b> clips up 40% in fitness this week", "Scanning trends"],
  ["ugc", "Turns your coloring books into promo video ideas you can make in Higgsfield.",
   "Brief: <b>mom and kid coloring the bunny page</b> · 9:16 · 15 seconds", "Writing a video brief"],
  ["sales", "Reads your weekly Amazon KDP report and shows your book sales.",
   "This week: <b>14 books sold</b> · $38.20 in royalties", "Reading KDP report"],
  ["manager", "Your Social Media Manager. Talk or type to him. He runs the team, gives you straight numbers and always asks before anything posts.",
   "<b>“Mr. McDonald, clip 1 did 1,240 views. I'd post clip 2 Friday 6:30 PM. OK?”</b>", "Talking to you"],
];
const DEMO_MS = 6500;
let demo = null;   // {i, play, timer, real}
function demoState(i) {
  const fake = JSON.parse(JSON.stringify(demo.real));
  fake.errors = [];
  const reached = id => DEMO_STEPS.findIndex(x => x[0] === id) <= i;
  fake.clips_waiting = i >= 3 && i < 4 ? [{}] : [];
  fake.stats = Object.assign({}, fake.stats, {views: reached("analyst") ? 1240 : null});
  fake.posts_used = reached("courier") ? 1 : 0;
  fake.posts_limit = fake.posts_limit || 10;
  fake.sales = Object.assign({}, fake.sales, reached("sales") ? {imported_at: "demo", royalty: 38.2} : {imported_at: null});
  fake.workers = fake.workers.map(w => {
    const k = DEMO_STEPS.findIndex(x => x[0] === w.id);
    if (k === i) return Object.assign({}, w, {status: w.id === "desk" ? "you" : "ok", doing: DEMO_STEPS[k][3], count: 1});
    if (k < i) return Object.assign({}, w, {status: "idle", doing: "Done ✓"});
    return Object.assign({}, w, {status: "idle", doing: "Up next"});
  });
  return fake;
}
function demoShow() {
  const i = demo.i;
  if (i >= DEMO_STEPS.length) {
    S = demoState(DEMO_STEPS.length - 1); lastFloor = ""; render();
    document.querySelectorAll(".st").forEach(el => el.classList.remove("spot"));
    $("#demoRoot").innerHTML = `<div class="demoflag">DEMO · sample data only · nothing is posted · no credits spent</div>
      <div class="demobox"><img src="${EMP_IMG("manager")}" alt=""><div>
        <div class="step">Demo finished</div><h3>That's your whole team, Mr. McDonald</h3>
        <p>Nothing was posted and no credits were spent. Press Exit to go back to your real dashboard.</p>
        <div class="row"><span class="dots"></span><button class="btn" data-demo="replay">↺ Replay</button><button class="btn go" data-demo="exit">Exit demo</button></div></div></div>`;
    return;
  }
  const [id, what, ex] = DEMO_STEPS[i];
  S = demoState(i); lastFloor = ""; render();
  const w = S.workers.find(x => x.id === id) || {name: id};
  document.querySelectorAll(".st").forEach(el => {
    const k = DEMO_STEPS.findIndex(x => x[0] === el.dataset.open);
    el.classList.toggle("spot", k === i); el.classList.toggle("done", k < i);
  });
  const spot = document.querySelector(`.st[data-open="${id}"]`);
  if (spot) spot.scrollIntoView({behavior: "smooth", block: "center"});
  $("#demoRoot").innerHTML = `<div class="demoflag">DEMO · sample data only · nothing is posted · no credits spent</div>
    <div class="demobox ${demo.play ? "play" : ""}"><img src="${EMP_IMG(id)}" alt=""><div>
      <div class="step">Step ${i + 1} of ${DEMO_STEPS.length}</div><h3>${esc(w.name)}</h3>
      <p>${what}</p><div class="ex">${ex}</div>
      <div class="row"><span class="dots">${DEMO_STEPS.map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</span>
        <button class="btn sm" data-demo="back" ${i ? "" : "disabled"}>◀ Back</button>
        <button class="btn sm" data-demo="play">${demo.play ? "❚❚ Pause" : "▶ Play"}</button>
        <button class="btn go sm" data-demo="next">Next ▶</button>
        <button class="btn sm" data-demo="exit">Exit</button></div></div>
      <div class="bar2"><i style="animation-duration:${DEMO_MS}ms"></i></div></div>`;
  clearTimeout(demo.timer);
  if (demo.play) demo.timer = setTimeout(() => { demo.i++; demoShow(); }, DEMO_MS);
}
function demoStart() {
  if (!S) return;
  closeSheet();
  demo = {i: 0, play: true, timer: null, real: JSON.parse(JSON.stringify(S))};
  document.body.classList.add("demo");
  window.scrollTo({top: 0});
  demoShow();
}
function demoExit() {
  if (!demo) return;
  clearTimeout(demo.timer);
  S = demo.real; demo = null;
  document.body.classList.remove("demo");
  $("#demoRoot").innerHTML = ""; lastFloor = ""; render(); refresh();
}
document.addEventListener("keydown", e => {
  if (!demo) return;
  if (e.key === "Escape") demoExit();
  if (e.key === "ArrowRight") { demo.i++; demoShow(); }
  if (e.key === "ArrowLeft" && demo.i > 0) { demo.i--; demoShow(); }
});

/* ---------- clicks ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-scrim]");
  if (!t) return;
  if (t.hasAttribute("data-scrim") && e.target === t) return closeSheet();
  const d = t.dataset;
  if (t.id === "demoBtn") return demoStart();
  if (demo) {
    if (d.demo === "exit") return demoExit();
    if (d.demo === "next") { demo.i++; return demoShow(); }
    if (d.demo === "back") { demo.i = Math.max(0, demo.i - 1); return demoShow(); }
    if (d.demo === "play") { demo.play = !demo.play; return demoShow(); }
    if (d.demo === "replay") { demo.i = 0; demo.play = true; return demoShow(); }
    if (d.open) { const k = DEMO_STEPS.findIndex(x => x[0] === d.open); if (k >= 0) { demo.i = k; demo.play = false; demoShow(); } }
    return;  // nothing real can be pressed during the demo
  }
  if (d.open) return openSheet(d.open);
  if (t.hasAttribute("data-close")) return closeSheet();
  if (d.act === "settings" || t.id === "settingsBtn") return openSheet("settings");
  if (t.id === "talkBtn") return openSheet("manager");
  if (d.dismiss) return api("/api/dismiss-error", {id: d.dismiss});
  if (d.retry) return api("/api/retry", {error_id: d.retry});
  if (t.id === "capGo") { t.disabled = true; t.textContent = "Writing…"; return api("/api/captions"); }
  if (d.plat) { t.classList.toggle("on"); return; }
  if (d.style) { t.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === t)); return; }
  const card = t.closest("[data-clip]");
  const read = () => ({
    id: card.dataset.clip,
    caption: $("[data-f=caption]", card).value, hashtags: $("[data-f=hashtags]", card).value,
    time: $("[data-f=time]", card).value,
    platforms: [...card.querySelectorAll(".chip.on")].map(c => c.dataset.plat),
    music: $("[data-music]", card).value
  });
  if (d.approve) { const v = read(); if (!v.platforms.length) return toast("Pick at least one platform."); return api("/api/approve", v); }
  if (d.preview) { const v = read(); if (v.music === "none") v.music = "auto"; toast("Mixing music…"); const j = await api("/api/music-preview", {id: v.id, music: v.music}); if (j.ok) toast("Press play to hear it with " + j.track); return; }
  if (d.skip) return api("/api/skip", {id: d.skip});
  if (d.redo) {
    const box = document.createElement("div"); box.className = "box";
    box.innerHTML = `<label class="f">What should change?<input type="text" placeholder="e.g. make it shorter, start at the punchline"></label><div class="row"><button class="btn go sm">Redo tonight</button></div>`;
    t.closest(".fields").appendChild(box); const inp = $("input", box); inp.focus();
    $("button", box).onclick = () => inp.value.trim() && api("/api/redo", {id: d.redo, note: inp.value.trim()});
    return;
  }
  if (d.postnow) { t.disabled = true; t.textContent = "Posting…"; return api("/api/post-now", {id: d.postnow}); }
  if (d.unsched) return api("/api/unschedule", {id: d.unsched});
  if (d.copy) { const c = [...S.tiktok].find(x => x.id === d.copy); return copyText((c.caption || "") + "\n\n" + (c.hashtags || "")); }
  if (d.reveal) return api("/api/reveal", {id: d.reveal});
  if (d.ttdone) return api("/api/tiktok-done", {id: d.ttdone});
  if (d.model) return api("/api/model", {model: d.model});
  if (d.confirm) return api("/api/confirm", {id: d.confirm, yes: true});
  if (d.cancel) return api("/api/confirm", {id: d.cancel, yes: false});
  if (d.delbook) return api("/api/book", {delete: d.delbook});
  if (t.id === "ugcGo") { const style = $("#ugcStyles .chip.on").dataset.style; return api("/api/ugc-brief", {book_id: $("#ugcBook").value, style}); }
  if (d.copyprompt) { const u = S.ugc.find(x => x.id === d.copyprompt); return copyText(u.prompt); }
  if (d.ugcdrop) return pickFile("video/*", f => upload("ugc", f, "&brief=" + d.ugcdrop));
});
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); toast("Copied."); }
  catch (e) { prompt("Copy this:", s); }
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

refresh();
setInterval(() => { if (!busy && !document.hidden) refresh(); }, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !busy) refresh(); });
</script>
